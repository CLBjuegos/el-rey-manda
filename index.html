</style>
</head>

function App(){
  const [tab,setTab]=useState('inicio');
  const [numEq,setNumEq]=useState(4);
  const [rondas,setRondas]=useState(10);
  const [eqNombres,setEqNombres]=useState(['','','','','','']);
  const [niveles,setNiveles]=useState({tibio:true,caliente:false,llamas:false});
  const [customPrendas,setCustomPrendas]=useState([]);
  const [newPrenda,setNewPrenda]=useState('');
  const [newPrendaNivel,setNewPrendaNivel]=useState('tibio');
  const [juego,setJuego]=useState(null);
  const [modalReglas,setModalReglas]=useState(false);

  function addCustomPrenda(){
    if(!newPrenda.trim())return;
    setCustomPrendas([...customPrendas,{id:'cust-'+Date.now(),txt:newPrenda.trim(),nivel:newPrendaNivel}]);
    setNewPrenda('');
  }
  function removeCustomPrenda(id){
    setCustomPrendas(customPrendas.filter(p=>p.id!==id));
  }
  function iniciarJuego(){
    let pool=[];
    if(niveles.tibio) pool=[...pool,...INIT.tibio,...customPrendas.filter(p=>p.nivel==='tibio')];
    if(niveles.caliente) pool=[...pool,...INIT.caliente,...customPrendas.filter(p=>p.nivel==='caliente')];
    if(niveles.llamas) pool=[...pool,...INIT.llamas,...customPrendas.filter(p=>p.nivel==='llamas')];
    if(pool.length===0) pool=[...INIT.tibio];
    
    let listEq=[];
    for(let i=0;i<numEq;i++){
      listEq.push({id:i,nombre:eqNombres[i].trim()||`Equipo ${i+1}`,color:COLORES[i]||'#fff',puntos:0});
    }
    setJuego({
      rondaActual:1,
      totalRondas:rondas,
      equipos:listEq,
      poolPrendas:pool,
      fase:'rey',
      rey:null,
      prendaActual:null,
      seleccionados:[],
      veredictos:{},
      ultimaOrdenInfo:null
    });
    setTab('juego');
  }
  function reiniciarCompleto(){
    setJuego(null);
    setTab('inicio');
  }
  return(
    <div class="app">
      {tab==='inicio'&&(
        <div class="splash">
          <div class="corona-anim">♛</div>
          <h1 class="titulo">EL REY MANDA</h1>
          <p class="subtitulo">Premium Local Board</p>
          <p class="tagline">Disfrutá la experiencia original en tu pantalla corporativa</p>
          <div style={{marginTop:'2.5rem'}}>
            <button class="btn-gold" onClick={()=>setTab('setup')}>CONFIGURAR JUEGO</button>
          </div>
          <p class="disc">Prohibida su venta, alquiler o exhibición pública no autorizada. Sistema verificado bajo licencia original de Carlos Lucas Bertarelli.</p>
        </div>
      )}
      {tab==='setup'&&(
        <div class="page">
          <div class="header-page"><h2>Ajustes Realeza</h2></div>
          <div class="card">
            <span class="lbl">Cantidad de Equipos ({numEq})</span>
            <div class="num-grid">
              {[2,3,4,5,6].map(n=>(
                <button key={n} class={`btn-num ${numEq===n?'on':''}`} onClick={()=>setNumEq(n)}>{n}</button>
              ))}
            </div>
          </div>
          <div class="card">
            <span class="lbl">Nombres de Equipos</span>
            <div class="nombres-grid">
              {Array.from({length:numEq}).map((_,i)=>(
                <div key={i} class="jugador-row">
                  <div class="equipo-dot" style={{background:COLORES[i]}}></div>
                  <input type="text" class="input-nombre" placeholder={`Equipo ${i+1}`} value={eqNombres[i]||''} onChange={e=>{
                    let aux=[...eqNombres];aux[i]=e.target.value;setEqNombres(aux);
                  }}/>
                </div>
              ))}
            </div>
          </div>
          <div class="card">
            <span class="lbl">Rondas de la Partida</span>
            <div class="rondas-row">
              <button class="btn-circ" onClick={()=>setRondas(Math.max(5,rondas-5))}>-</button>
              <div class="rondas-n">{rondas}</div>
              <button class="btn-circ" onClick={()=>setRondas(Math.min(50,rondas+5))}>+</button>
            </div>
          </div>
          <div class="card">
            <span class="lbl">Intensidad de Prendas</span>
            <div style={{display:'flex',gap:'.5rem',marginTop:'.4rem'}}>
              <button class={`btn-sm ${niveles.tibio?'on':''}`} onClick={()=>setNiveles({...niveles,tibio:!niveles.tibio})}>🌡️ Tibio</button>
              <button class={`btn-sm ${niveles.caliente?'on':''}`} onClick={()=>setNiveles({...niveles,caliente:!niveles.caliente})}>🔥 Caliente</button>
              <button class={`btn-sm ${niveles.llamas?'on':''}`} onClick={()=>setNiveles({...niveles,llamas:!niveles.llamas})}>💥 Llamas</button>
            </div>
          </div>
          <div style={{margin:'1.5rem 0 2rem'}}>
            <button class="btn-gold" style={{width:'100%'}} onClick={iniciarJuego}>EMPEZAR REINADO</button>
          </div>
        </div>
      )}

          <div class="card add-prenda">
            <span class="lbl">Crear Nueva Prenda</span>
            <textarea placeholder="Escribí acá la penitencia o consigna..." value={newPrenda} onChange={e=>setNewPrenda(e.target.value)}></textarea>
            <div class="add-nivel-sel">
              <button class={`add-n-btn ${newPrendaNivel==='tibio'?'on':''}`} onClick={()=>setNewPrendaNivel('tibio')}>🌡️ Tibio</button>
              <button class={`add-n-btn ${newPrendaNivel==='caliente'?'on':''}`} onClick={()=>setNewPrendaNivel('caliente')}>🔥 Caliente</button>
              <button class={`add-n-btn ${newPrendaNivel==='llamas'?'on':''}`} onClick={()=>setNewPrendaNivel('llamas')}>💥 Llamas</button>
            </div>
            <button class="btn-outline" style={{padding:'.4rem 1rem',fontSize:'.8rem',marginTop:'.3rem'}} onClick={addCustomPrenda}>Guardar Prenda</button>
          </div>
          <div class="nivel-section">
            <h3 style={{fontFamily:'Playfair Display',fontSize:'1.1rem',color:'var(--oro)',margin:'1rem 0 .5rem'}}>Prendas Personalizadas Activas</h3>
            {customPrendas.length===0?<p class="nota">No agregaste ninguna prenda personalizada todavía.</p>:
              customPrendas.map(p=>(
                <div key={p.id} class="prenda-item prenda-custom">
                  <div class="prenda-txt"><strong>[{p.nivel.toUpperCase()}]</strong> {p.txt}</div>
                  <button class="btn-danger" onClick={()=>removeCustomPrenda(p.id)}>×</button>
                </div>
              ))
            }
          </div>
        </div>
      )}
      {tab==='scores'&&(
        <div class="page">
          <div class="header-page"><h2>Sala de Puntuación</h2></div>
          {juego?juego.equipos.map(e=>(
            <div key={e.id} class="score-card" style={{borderLeft:`4px solid ${e.color}`}}>
              <div class="score-top">
                <div class="score-equipo"><div class="equipo-dot" style={{background:e.color}}></div>{e.nombre}</div>
                <div class="score-pts">{e.puntos} <span style={{fontSize:'.75rem',color:'rgba(245,240,232,.3)'}}>PTS</span></div>
              </div>
            </div>
          )):<p class="nota">No hay ninguna partida activa para contabilizar.</p>}
          {juego&&(
            <button class="btn-outline" style={{width:'100%',marginTop:'1rem',color:'#fca5a5',borderColor:'rgba(239,68,68,.2)'}} onClick={reiniciarCompleto}>
              ABANDONAR PARTIDA ACTUAL
            </button>
          )}
        </div>
      )}
      {tab==='juego'&&juego&&(
        <div class="page">
          <div class="game-header">
            <button class="btn-outline" style={{padding:'.3rem .6rem',fontSize:'.7rem'}} onClick={()=>setModalReglas(true)}>REGLAS</button>
            <div class="ronda-info">
              <div class="ronda-lbl">RONDA</div>
              <div class="ronda-n">{juego.rondaActual} <span style={{fontSize:'.9rem',color:'rgba(201,168,76,.4)'}}>/ {juego.totalRondas}</span></div>
            </div>
            <div style={{fontSize:'.75rem',color:'var(--oro)',letterSpacing:'1px'}}>PRENDAS: {juego.poolPrendas.length}</div>
          </div>
          {juego.fase==='rey'&&(
            <div class="fase">
              <div class="fase-icon">👑</div>
              <h3 class="fase-titulo">¿Qué equipo tomó la Corona de Rey?</h3>
              <div class="jugadores-pick">
                {juego.equipos.map(e=>(
                  <button key={e.id} class="pick-btn" style={{borderLeftColor:e.color}} onClick={()=>{
                    let rIdx=Math.floor(Math.random()*juego.poolPrendas.length);
                    let selectedPrenda=juego.poolPrendas[rIdx]||{id:'fallback',txt:'El Rey dicta una prenda libre.',nivel:'tibio'};
                    setJuego({
                      ...juego,
                      rey:e.id,
                      prendaActual:selectedPrenda,
                      fase:'consigna',
                      seleccionados:[],
                      veredictos:{}
                    });
                  }}>{e.nombre}</button>
                ))}
              </div>
            </div>
          )}
          {juego.fase==='consigna'&&(
            <div class="fase">
              <h3 class="fase-titulo" style={{fontSize:'1.1rem'}}>Rey Activo: <span style={{color:juego.equipos.find(e=>e.id===juego.rey)?.color}}>{juego.equipos.find(e=>e.id===juego.rey)?.nombre}</span></h3>
              <div class="consigna-box">
                <span class={NB[juego.prendaActual.nivel]||'badge'}>{NL[juego.prendaActual.nivel]||'Prenda'}</span>
                <p class="consigna-txt">"{juego.prendaActual.txt}"</p>
              </div>
              <div style={{textAlign:'left',marginBottom:'1rem'}}>
                <span class="lbl">Equipos obligados a cumplir:</span>
              </div>
              <div class="jugadores-sel">
                {juego.equipos.map(e=>{
                  let esRey=e.id===juego.rey;
                  let isSel=juego.seleccionados.includes(e.id);
                  return(
                    <button key={e.id} disabled={esRey} class={`sel-btn ${esRey?'es-rey':''} ${isSel?'on':''}`} style={{borderLeftColor:e.color}} onClick={()=>{
                      if(juego.seleccionados.includes(e.id)){
                        setJuego({...juego,seleccionados:juego.seleccionados.filter(id=>id!==e.id)});
                      }else{
                        setJuego({...juego,seleccionados:[...juego.seleccionados,e.id]});
                      }
                    }}>{e.nombre} {esRey?'(REY)':''}</button>
                  );
                })}
              </div>
              <button class="btn-gold" style={{width:'100%',marginTop:'.8rem',fontSize:'.95rem'}} disabled={juego.seleccionados.length===0} onClick={()=>{
                let initV={};
                juego.seleccionados.forEach(id=>{initV[id]=true;});
                setJuego({...juego,fase:'veredicto',veredictos:initV});
              }}>EVALUAR CUMPLIMIENTO</button>
            </div>
          )}
          {juego.fase==='veredicto'&&(
            <div class="fase">
              <h3 class="fase-titulo">Veredicto Real</h3>
              <div class="veredicto-grid">
                {juego.seleccionados.map(id=>{
                  let e=juego.equipos.find(x=>x.id===id);
                  let vVal=juego.veredictos[id];
                  return(
                    <div key={id} class="v-card" style={{borderTop:`2px solid ${e.color}`}}>
                      <div class="v-nombre">{e.nombre}</div>
                      <div class="v-btns">

                        <button class={`v-btn v-no ${vVal===false?'on':''}`} onClick={()=>setJuego({...juego,veredictos:{...juego.veredictos,[id]:false}})}>NO</button>
                      </div>
                    </div>
                  );
                })}
              </div>
              <button class="btn-gold" style={{width:'100%',marginTop:'1rem'} } onClick={()=>{
                let nextEq=juego.equipos.map(e=>{
                  if(juego.veredictos[e.id]===true){
                    return{...e,puntos:e.puntos+1};
                  }
                  return e;
                });
                let ordTxt=`"${juego.prendaActual.txt}" dictada por Rey ${juego.equipos.find(x=>x.id===juego.rey)?.nombre}. `;
                let nextRonda=juego.rondaActual+1;
                if(juego.rondaActual>=juego.totalRondas){
                  setJuego({...juego,equipos:nextEq,ultimaOrdenInfo:ordTxt,fase:'ganador'});
                }else{
                  setJuego({
                    ...juego,
                    equipos:nextEq,
                    rondaActual:nextRonda,
                    fase:'rey',
                    rey:null,
                    prendaActual:null,
                    seleccionados:[],
                    veredictos:{},
                    ultimaOrdenInfo:ordTxt
                  });
                }
              }}>SIGUIENTE RONDA →</button>
            </div>
          )}
          {juego.fase==='ganador'&&(
            <div class="winner">
              <div style={{fontSize:'4rem'}}>🏆</div>
              <h1>FIN DE LA PARTIDA</h1>
              {(()=> {
                let maxPts=Math.max(...juego.equipos.map(e=>e.puntos));
                let ganadores=juego.equipos.filter(e=>e.puntos===maxPts);
                return(
                  <div>
                    <div class="winner-equipo">{ganadores.map(g=>g.nombre).join(' & ')}</div>
                    <div class="winner-pts">{maxPts} PUNTOS TOTALES</div>
                  </div>
                );
              })()}
              <div class="card" style={{width:'100%',maxWidth:400,background:'rgba(255,255,255,.02)',textAlign:'left'}}>
                <span class="lbl" style={{textAlign:'center'}}>Podio Real Final</span>
                {[...juego.equipos].sort((a,b)=>b.puntos-a.puntos).map((e,idx)=>(
                  <div key={e.id} class="podio-item">
                    <span class="podio-pos">#{idx+1} {e.nombre}</span>
                    <span class="podio-pts">{e.puntos} Pts</span>
                  </div>
                ))}
              </div>
              {juego.ultimaOrdenInfo&&(
                <div class="ultima-orden">
                  <h3>Última Orden de la Noche</h3>
                  <p>{juego.ultimaOrdenInfo}</p>
                </div>
              )}
              <button class="btn-gold" style={{marginTop:'1rem'}} onClick={reiniciarCompleto}>REINICIAR TABLERO</button>

      {modalReglas&&(

          <div class="modal-content">
            <h2 style={{fontFamily:'Playfair Display',color:'var(--oro-claro)',marginBottom:'1rem',textAlign:'center'}}>Reglas de la Corona</h2>
            <p style={{fontSize:'.95rem',lineHeight:1.6,color:'rgba(245,240,232,.8)',marginBottom:'.8rem'}}>1. El equipo seleccionado como <strong>Rey</strong> toma el control de la ronda y lee la consigna en voz alta.</p>
            <p style={{fontSize:'.95rem',lineHeight:1.6,color:'rgba(245,240,232,.8)',marginBottom:'.8rem'}}>2. El Rey decide cuáles de los demás equipos quedan obligados a realizar el reto.</p>
            <p style={{fontSize:'.95rem',lineHeight:1.6,color:'rgba(245,240,232,.8)',marginBottom:'.8rem'}}>3. Una vez finalizada la prueba, se evalúa quién cumplió. Los que digan <strong>SÍ</strong> sumarán un punto en el marcador general.</p>
            <button class="btn-outline" style={{width:'100%',marginTop:'1rem'}} onClick={()=>setModalReglas(false)}>ENTENDIDO</button>
          </div>
        </div>
      )}
      <div class="nav-bar">
        <div class="nav-bar-container">
          <button class={`nav-btn ${tab==='inicio'||tab==='setup'||tab==='juego'?'on':''}`} onClick={()=>setTab(juego?'juego':'inicio')}>🎴 JUEGO</button>
          <button class={`nav-btn ${tab==='prendas'?'on':''}`} onClick={()=>setTab('prendas')}>📜 MAZO</button>
          <button class={`nav-btn ${tab==='scores'?'on':''}`} onClick={()=>setTab('scores')}>📊 PUNTOS</button>
        </div>
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
