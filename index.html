                                                        setPartida({
                                                            ...partida,

                                                            equiposSeleccionados: [],
                                                            votos: {}

                                                    class={`p-3 text-sm font-medium border rounded text-center transition hover:brightness-110 active:scale-98 border-l-4 ${eq.colorClass}`}

                                                    {eq.nombre}
                                                </button>
                                            ))}
                                        </div>

                                                        return { ...eq, puntos: eq.puntos + 1 };
                                                    }
                                                    return eq;
                                                });

                                                const historialTxt = `"${partida.prendaActual.texto}" decretada por el equipo Rey: ${partida.equipos.find(e => e.id === partida.reyActual)?.nombre}.`;

                                                if (partida.ronda >= partida.totalRondas) {
                                                    setPartida({
                                                        ...partida,
                                                        equipos: listaEquiposActualizada,
                                                        historialUltimaPrenda: historialTxt,
                                                        fase: 'fin'
                                                    });
                                                } else {
                                                    setPartida({
                                                        ...partida,
                                                        equipos: listaEquiposActualizada,
                                                        ronda: partida.ronda + 1,
                                                        fase: 'seleccion_rey',
                                                        reyActual: null,
                                                        prendaActual: null,
                                                        equiposSeleccionados: [],
                                                        votos: {},
                                                        historialUltimaPrenda: historialTxt
                                                    });
                                                }

                                            {partida.ronda >= partida.totalRondas ? 'Concluir Torneo' : 'Siguiente Ronda'}

                                        </div>

                                                <p class="text-stone-400 text-xs italic leading-normal">
                                                    {partida.historialUltimaPrenda}
                                                </p>
                                            </div>

                                        <button 
                                            onClick={reiniciarJuegoCompleto}
                                            class="w-full bg-stone-900 border border-stone-700 text-stone-300 font-royal font-bold text-xs tracking-widest py-3 uppercase hover:border-stone-500"
                                            style={{ clipPath: 'polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%)' }}
                                        >
                                            Reiniciar Tablero
                                        </button>
                                    </div>
                                )}

                            </div>
                        </div>

                    {vista === 'mazo' && (
                        <div class="flex-1 py-4 flex flex-col justify-between">

                                                    <span class="text-[9px] uppercase font-mono mr-1 text-amber-500 bg-amber-500/5 px-1 rounded border border-amber-500/10">{p.nivel}</span>

                                                    onClick={() => eliminarPrendaCustom(p.id)}

                                                    ×

                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                                {partida ? (
                                    partida.equipos.map(eq => (

                                            <div class="flex items-center space-x-2.5 truncate">
                                                <div class={`w-2.5 h-2.5 rounded-full ${eq.dotClass}`}></div>
                                                <span class="font-royal text-sm font-bold tracking-wide text-stone-100 truncate pr-2">{eq.nombre}</span>

                                onClick={() => setVista(partida ? 'juego' : 'inicio')}

                            >
                                <span class="text-base mb-0.5">🎴</span>
                                <span class="text-[9px] font-royal tracking-wider uppercase font-bold">Juego</span>
                            </button>
                            <button 
                                onClick={() => setVista('mazo')}
                                class={`flex-1 py-2 rounded text-center transition flex flex-col items-center justify-center ${vista === 'mazo' ? 'bg-stone-900 border border-amber-500/30 text-amber-400' : 'text-stone-500 hover:text-stone-300'}`}
                            >
                                <span class="text-base mb-0.5">📜</span>
                                <span class="text-[9px] font-royal tracking-wider uppercase font-bold">Mazo</span>
                            </button>
                            <button 
                                onClick={() => setVista('puntuacion')}
                                class={`flex-1 py-2 rounded text-center transition flex flex-col items-center justify-center ${vista === 'puntuacion' ? 'bg-stone-900 border border-amber-500/30 text-amber-400' : 'text-stone-500 hover:text-stone-300'}`}
                            >
                                <span class="text-base mb-0.5">📊</span>
                                <span class="text-[9px] font-royal tracking-wider uppercase font-bold">Puntos</span>
                            </button>
                        </div>
                    </div>

                    {/* MODAL: REGLAS DEL JUEGO */}
                    {mostrarReglas && (
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
                            <div class="bg-stone-900 border border-amber-500/40 p-5 rounded max-w-xs w-full shadow-2xl relative">
                                <h3 class="font-royal text-amber-400 text-center font-bold text-sm tracking-widest mb-3 uppercase">Leyes de la Corona</h3>
                                <div class="text-xs text-stone-300 space-y-2.5 leading-relaxed font-sans max-h-64 overflow-y-auto pr-1">
                                    <p>1. Un equipo asume de forma voluntaria el rol de <strong class="text-amber-400">Rey o Reyna</strong> para la ronda en curso.</p>
                                    <p>2. El sistema despliega de forma automatizada un edicto real secreto basado en los niveles de intensidad activos.</p>
                                    <p>3. El Rey determina cuáles de los demás equipos (plebeyos) están obligados a ejecutar el reto impuesto.</p>
                                    <p>4. Una vez concluida la acción, se realiza el escrutinio. Cada plebeyo que haya cumplido de manera satisfactoria (marcado con <strong>SÍ</strong>) sumará un punto en el monitor general.</p>
                                </div>
                                <button 
                                    onClick={() => setMostrarReglas(false)}
                                    class="w-full mt-4 bg-amber-500 text-stone-950 font-royal font-bold text-xs tracking-widest py-2 uppercase rounded hover:bg-amber-400"
                                >
                                    Entendido
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<JuegoReyManda />);
    </script>
</body>
</html>
