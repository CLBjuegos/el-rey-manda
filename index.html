                }
            };

                setEquipos(equipos.map(e => e.id === id ? { ...e, [campo]: valor } : e));
            };

                const lista = prendasPredefinidas[intensidad];
                const random = Math.floor(Math.random() * lista.length);
                setPrendaActual(lista[random]);

                                                onChange={(e) => manejarCambioEquipo(eq.id, 'nombre', e.target.value)}
