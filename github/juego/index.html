<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:20px}
:root{--negro:#080808;--oro:#c9a84c;--oro-claro:#f0d080;--oro-oscuro:#8a6e2f;--violeta:#7c3aed;--violeta-claro:#a78bfa;--blanco:#f5f0e8;--gris:#2a2a2a}
body{background:var(--negro);color:var(--blanco);font-family:'Cormorant Garamond',serif;min-height:100vh;font-size:1rem}
.app{display:flex;flex-direction:column;align-items:center;min-height:100vh}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 2rem 5rem;background:radial-gradient(ellipse at center,#1a1008,#080808)}
.copyright-bar{width:100%;background:rgba(8,8,8,.97);border-bottom:1px solid rgba(201,168,76,.2);padding:.45rem 1rem;text-align:center;z-index:50}
.corona-anim{font-size:5rem;animation:flota 3s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(201,168,76,.6))}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.titulo{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,var(--oro-oscuro),var(--oro-claro),var(--oro));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;letter-spacing:2px;margin:.5rem 0}
.subtitulo{font-style:italic;color:var(--oro);letter-spacing:3px;font-size:1rem;opacity:.8}
.tagline{color:rgba(245,240,232,.4);font-size:.85rem;margin-top:1rem;letter-spacing:1px}
.disc{margin-top:2rem;font-size:.72rem;color:rgba(245,240,232,.25);max-width:280px;line-height:1.7}
.btn-gold{background:linear-gradient(135deg,var(--oro-oscuro),var(--oro));color:var(--negro);border:none;padding:1rem 2.5rem;font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .25s;text-transform:uppercase;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%)}
.btn-gold:hover{opacity:.88;transform:scale(1.03)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1px solid rgba(201,168,76,.4);color:var(--oro);padding:.7rem 1.5rem;font-size:.85rem;cursor:pointer;letter-spacing:1px;transition:all .2s}
.btn-sm{background:transparent;border:1px solid rgba(201,168,76,.3);color:var(--oro);padding:.5rem 1rem;font-size:.85rem;cursor:pointer;letter-spacing:1px;border-radius:3px;transition:all .2s}
.btn-sm.on{background:rgba(201,168,76,.12);border-color:var(--oro);color:var(--oro-claro)}
.btn-danger{background:transparent;border:none;color:rgba(239,68,68,.45);cursor:pointer;font-size:1rem;padding:.2rem .4rem;transition:color .2s;flex-shrink:0}
.btn-danger:hover{color:rgba(239,68,68,.9)}
.page{width:100%;max-width:520px;padding:1.5rem;margin:0 auto;padding-bottom:90px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.18);border-radius:6px;padding:1.25rem;margin-bottom:1rem}
.lbl{color:var(--oro);font-size:.82rem;letter-spacing:3px;text-transform:uppercase;display:block;margin-bottom:.6rem}
.nota{font-size:.85rem;color:rgba(245,240,232,.35);line-height:1.6;text-align:center;padding:.4rem 0}
.badge{display:inline-block;padding:.25rem .85rem;border-radius:20px;font-size:.78rem;letter-spacing:2px}
.badge-tibio{background:rgba(59,130,246,.18);color:#93c5fd;border:1px solid rgba(59,130,246,.3)}
.badge-caliente{background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.badge-llamas{background:rgba(245,158,11,.18);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.exito{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:4px;padding:.6rem;font-size:.8rem;color:#86efac;text-align:center;margin-bottom:.75rem}
.header-page{text-align:center;padding:1.5rem 0 1rem}
.header-page h2{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--oro-claro)}
.num-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.btn-num{background:transparent;border:1px solid rgba(201,168,76,.3);color:var(--blanco);padding:.6rem .2rem;font-family:'Playfair Display',serif;font-size:.95rem;cursor:pointer;border-radius:3px;transition:all .2s}
.btn-num.on{background:var(--oro);color:var(--negro);font-weight:700;border-color:var(--oro)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.toggle{width:50px;height:26px;background:#333;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .3s;flex-shrink:0}
.toggle.on{background:var(--violeta)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .3s}
.toggle.on::after{left:27px}
.toggle-desc{font-size:.95rem;color:rgba(245,240,232,.55);margin-top:.25rem}
.rondas-row{display:flex;align-items:center;gap:1rem;justify-content:center}
.btn-circ{background:transparent;border:1px solid rgba(201,168,76,.4);color:var(--oro);width:38px;height:38px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rondas-n{font-family:'Playfair Display',serif;font-size:2.2rem;color:var(--oro-claro);width:60px;text-align:center}
.nombres-grid{display:flex;flex-direction:column;gap:.5rem}
.jugador-row{display:flex;align-items:center;gap:.6rem}
.equipo-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.input-nombre{background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.25);color:var(--blanco);padding:.65rem .9rem;font-family:'Cormorant Garamond',serif;font-size:1.05rem;border-radius:3px;width:100%;outline:none;transition:border-color .2s}
.input-nombre:focus{border-color:var(--oro)}
.input-nombre::placeholder{color:rgba(245,240,232,.25)}
.equipo-label{font-size:.78rem;color:rgba(245,240,232,.4);white-space:nowrap}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid rgba(201,168,76,.18);margin-bottom:1.25rem}
.ronda-info{text-align:center}
.ronda-lbl{font-size:.78rem;letter-spacing:3px;color:var(--oro);text-transform:uppercase}
.ronda-n{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--oro-claro)}
.fase{text-align:center;padding:.5rem 0}
.fase-titulo{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--oro);letter-spacing:2px;margin-bottom:1.25rem}
.fase-icon{font-size:3rem;margin-bottom:.75rem}
.jugadores-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-bottom:1rem}
.pick-btn{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:rgba(245,240,232,.8);padding:.9rem .5rem;font-size:1.05rem;cursor:pointer;border-radius:4px;transition:all .2s;text-align:center;font-family:'Cormorant Garamond',serif;border-left-width:3px!important;border-left-style:solid!important}
.pick-btn:hover{border-color:var(--oro);color:var(--oro-claro);background:rgba(201,168,76,.08)}
.pick-btn.on{background:rgba(201,168,76,.15);border-color:var(--oro)!important;color:var(--oro-claro)}
.pick-btn.violeta{border-left-color:var(--violeta)!important}
.pick-btn.violeta.on{background:rgba(124,58,237,.15);border-color:var(--violeta-claro)!important;color:var(--violeta-claro)}
.consigna-box{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.28);border-radius:6px;padding:1.5rem;margin-bottom:1.25rem}
.consigna-oculta{min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:.5rem}
.consigna-oculta span{font-size:.78rem;color:var(--oro);letter-spacing:2px}
.consigna-txt{font-size:1.25rem;line-height:1.8;color:var(--blanco);font-style:italic;margin-top:.5rem}
.jugadores-sel{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-bottom:.75rem}
.sel-btn{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:rgba(245,240,232,.75);padding:.8rem .4rem;font-size:1rem;cursor:pointer;border-radius:4px;transition:all .2s;text-align:center;border-left-width:3px!important;border-left-style:solid!important}
.sel-btn:hover:not(.es-rey){border-top-color:rgba(201,168,76,.5);border-right-color:rgba(201,168,76,.5);border-bottom-color:rgba(201,168,76,.5)}
.sel-btn.on{background:rgba(201,168,76,.18);border-top-color:var(--oro)!important;border-right-color:var(--oro)!important;border-bottom-color:var(--oro)!important;color:var(--oro-claro)}
.sel-btn.es-rey{background:rgba(201,168,76,.07);color:rgba(201,168,76,.5);cursor:default;font-size:.88rem}
.todos-btn{width:100%;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.35);color:var(--violeta-claro);padding:.75rem;font-size:.95rem;cursor:pointer;margin-bottom:.75rem;letter-spacing:1px;transition:all .2s;border-radius:3px}
.todos-btn:hover:not(:disabled){background:rgba(124,58,237,.2)}
.todos-btn:disabled{opacity:.3;cursor:not-allowed}
.cooldown-txt{font-size:.82rem;color:rgba(245,240,232,.4);text-align:center;margin-bottom:.5rem}
.veredicto-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-bottom:.75rem}
.v-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:.75rem;text-align:center}
.v-nombre{font-size:1rem;margin-bottom:.6rem;color:var(--blanco)}
.v-btns{display:flex;gap:.4rem;justify-content:center}
.v-btn{padding:.45rem .65rem;font-size:.85rem;cursor:pointer;border-radius:3px;border:none;transition:all .2s}
.v-si{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.v-si.on{background:#15803d;color:#fff}
.v-no{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.v-no.on{background:#b91c1c;color:#fff}
.score-card{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.18);border-radius:5px;padding:1rem;margin-bottom:.75rem}
.score-top{display:flex;justify-content:space-between;align-items:center}
.score-equipo{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--oro-claro);display:flex;align-items:center;gap:.5rem}
.score-pts{font-family:'Playfair Display',serif;font-size:2rem;color:var(--oro)}
.score-jgs{display:flex;gap:1rem;margin-top:.4rem;flex-wrap:wrap}
.score-jg{font-size:.9rem;color:rgba(245,240,232,.6)}
.nivel-section{margin-bottom:1.5rem}
.prenda-item{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:.7rem;margin-bottom:.4rem;display:flex;align-items:flex-start;gap:.5rem}
.prenda-txt{font-size:1rem;line-height:1.6;flex:1;color:rgba(245,240,232,.88)}
.prenda-custom{border-color:rgba(201,168,76,.22);background:rgba(201,168,76,.04)}
.add-prenda{background:rgba(255,255,255,.02);border:1px solid rgba(201,168,76,.2);border-radius:5px;padding:1rem;margin-top:1rem}
.add-prenda textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--blanco);padding:.6rem;font-family:'Cormorant Garamond',serif;font-size:.92rem;resize:vertical;min-height:65px;border-radius:3px;outline:none}
.add-prenda textarea::placeholder{color:rgba(245,240,232,.25)}
.add-nivel-sel{display:flex;gap:.4rem;margin:.5rem 0;flex-wrap:wrap}
.add-n-btn{background:transparent;border:1px solid rgba(255,255,255,.13);color:rgba(245,240,232,.45);padding:.3rem .65rem;font-size:.7rem;cursor:pointer;border-radius:3px;transition:all .2s}
.add-n-btn.on{border-color:var(--oro);color:var(--oro);background:rgba(201,168,76,.1)}
.winner{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:radial-gradient(ellipse at center,#1a1008,#080808)}
.winner h1{font-family:'Playfair Display',serif;font-size:2.4rem;color:var(--oro-claro);margin:1rem 0}
.winner-equipo{font-family:'Playfair Display',serif;font-size:1.9rem;background:linear-gradient(135deg,var(--oro-oscuro),var(--oro-claro));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.winner-pts{font-size:1rem;color:var(--oro);letter-spacing:2px;margin:.5rem 0 1.5rem}
.ultima-orden{background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.28);border-radius:6px;padding:1.5rem;margin:1rem 0;max-width:350px;text-align:left}
.ultima-orden h3{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--oro-claro);margin-bottom:.5rem}
.ultima-orden p{font-size:.85rem;color:rgba(245,240,232,.65);line-height:1.65;font-style:italic}
.podio-item{display:flex;justify-content:space-between;align-items:center;padding:.5rem .75rem;border-bottom:1px solid rgba(255,255,255,.05)}
.podio-pos{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--oro)}
.podio-pts{color:var(--oro-claro);font-family:'Playfair Display',serif}
.nav-bar{display:flex;gap:.4rem;justify-content:center;padding:.75rem 1rem;border-top:1px solid rgba(201,168,76,.13);background:rgba(5,5,5,.97);position:fixed;bottom:0;width:100%;backdrop-filter:blur(12px);z-index:9000}
.nav-btn{background:transparent;border:1px solid rgba(201,168,76,.2);color:rgba(245,240,232,.5);padding:.55rem .6rem;font-size:.78rem;cursor:pointer;letter-spacing:1px;transition:all .2s;flex:1;max-width:110px;border-radius:3px}
.nav-btn.on{background:rgba(201,168,76,.1);border-color:var(--oro);color:var(--oro-claro)}
</style>
</head>

/* ── HUELLA DEL DISPOSITIVO ── */
function getHuella(){
  const c=[
    navigator.userAgent,
    navigator.language,
    `${screen.width}x${screen.height}`,
    screen.colorDepth,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency||'?',
    navigator.platform||'?',
    Intl.DateTimeFormat().resolvedOptions().timeZone||'?'
  ].join('||');
  let h=0;
  for(let i=0;i<c.length;i++){h=Math.imul(31,h)+c.charCodeAt(i)|0}
  return Math.abs(h).toString(36).toUpperCase().padStart(8,'0');
}

/* ── VERIFICAR CÓDIGO CONTRA SUPABASE ── */
async function verificarCodigo(codigo, nombre){
  const huella = getHuella();
  const cod = codigo.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
  try{
    const r = await fetch(`${SB_URL}/rest/v1/licencias?codigo=eq.${cod}&select=*`,{
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
    });
    const data = await r.json();
    if(!data||data.length===0) return{ok:false,msg:'Código no válido. Verificá que lo escribiste correctamente.'};
    const lic=data[0];
    if(!lic.activo) return{ok:false,msg:'Este código fue desactivado. Contactá al soporte.'};
    if(lic.usado && lic.huella!==huella) return{ok:false,msg:'Este código ya está registrado en otro dispositivo y no es transferible.'};
    if(!lic.usado){
      await fetch(`${SB_URL}/rest/v1/licencias?codigo=eq.${cod}`,{
        method:'PATCH',
        headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({usado:true,huella,fecha_activacion:new Date().toISOString(),nombre_activacion:nombre.trim()})
      });
    }
    return{ok:true,nombre:nombre.trim()||lic.nombre||'Jugador'};
  }catch(e){
    return{ok:false,msg:'Sin conexión a internet. Necesitás conexión para activar por primera vez.'};
  }
}

      {fase==='veredicto'&&(
      <div className="fase">
        <div className="fase-titulo">VEREDICTO</div>
        <div className="nota" style={{marginBottom:'1rem'}}>El Rey/Reyna + observadores juzgan. El Rey/Reyna tiene la última palabra.</div>
        <div className="veredicto-grid">
          {eleg.map(id=>{
            const j=jugs.find(x=>x.id===id);
            return(
              <div key={id} className="v-card">
                <div className="v-nombre">{j?.nombre}</div>
                <div className="v-btns">
                  <button className={`v-btn v-si${vered[id]===true?' on':''}`} onClick={()=>setV(id,true)}>✓ Cumplió</button>
                  <button className={`v-btn v-no${vered[id]===false?' on':''}`} onClick={()=>setV(id,false)}>✗ No</button>
                </div>
              </div>
            );
          })}
        </div>
        <button className="btn-gold" style={{width:'100%'}} disabled={Object.values(vered).some(v=>v===null)} onClick={confVered}>
          {ronda>=totR?'🏆 VER GANADORES':'SIGUIENTE RONDA →'}
        </button>
        <button onClick={()=>{
          const nc=Math.max(0,cooldown-1);
          if(ronda>=totR){setPant('ganador')}
          else{setRonda(r=>r+1);setCooldown(nc);resetRonda();}
        }} style={{width:'100%',marginTop:'.6rem',background:'transparent',border:'1px solid rgba(239,68,68,.3)',color:'#fca5a5',padding:'.75rem',fontFamily:'Cinzel,serif',fontSize:'.82rem',cursor:'pointer',borderRadius:3,letterSpacing:'1px'}}>
          ⛔ SUSPENDER PRENDA — Sin puntos, nueva ronda
        </button>
      </div>
      )}
    </div>
    )}

    {/* ── MODAL PUNTAJES ── */}
    {panel==='scores'&&(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',zIndex:9999,display:'flex',flexDirection:'column',overflowY:'auto'}}>
      <div style={{width:'100%',maxWidth:520,margin:'0 auto',padding:'1.5rem'}}>
        {/* Botón cerrar grande */}
        <button onClick={()=>setPanel('juego')}
          style={{width:'100%',background:'linear-gradient(135deg,#7a5c28,#c9a84c)',color:'#080808',border:'none',padding:'1rem',fontFamily:'Playfair Display,serif',fontSize:'1.1rem',fontWeight:700,cursor:'pointer',borderRadius:4,marginBottom:'1.5rem',letterSpacing:'1px'}}>
          ✕ CERRAR PUNTAJES
        </button>
        <div style={{fontFamily:'Playfair Display,serif',fontSize:'1.5rem',color:'var(--oro-claro)',textAlign:'center',marginBottom:'.25rem'}}>♛ Puntajes</div>
        <div style={{textAlign:'center',fontSize:'.75rem',color:'rgba(245,240,232,.35)',marginBottom:'1.5rem'}}>Ronda {ronda} de {totR}</div>
        {calcEq().map((eq,i)=>(
          <div key={i} className="score-card">
            <div className="score-top">
              <div className="score-equipo"><span style={{color:COLORES[eq.idx%COLORES.length]}}>●</span>&nbsp;{i===0?'♛ ':''}{eq.ns.length===1?'Solo: ':'Equipo '+(eq.idx+1)}</div>
              <div className="score-pts">{eq.pts}</div>
            </div>
            <div className="score-jgs">
              {eq.ids.map(id=>{const j=jugs.find(x=>x.id===id);return <span key={id} className="score-jg">{j?.nombre}: {scores[id]||0} pts</span>})}
            </div>
          </div>
        ))}
        <button onClick={()=>setPanel('juego')}
          style={{width:'100%',marginTop:'1rem',background:'transparent',border:'1px solid rgba(201,168,76,.4)',color:'var(--oro)',padding:'.75rem',fontFamily:'Cinzel,serif',fontSize:'.8rem',cursor:'pointer',borderRadius:3,letterSpacing:'2px'}}>
          ← VOLVER AL JUEGO
        </button>
      </div>
    </div>
    )}

    {/* ── MODAL PRENDAS ── */}
    {panel==='prendas'&&(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',zIndex:9999,display:'flex',flexDirection:'column',overflowY:'auto'}}>
      <div style={{width:'100%',maxWidth:520,margin:'0 auto',padding:'1.5rem'}}>
        <button onClick={()=>setPanel('juego')}
          style={{width:'100%',background:'linear-gradient(135deg,#7a5c28,#c9a84c)',color:'#080808',border:'none',padding:'1rem',fontFamily:'Playfair Display,serif',fontSize:'1.1rem',fontWeight:700,cursor:'pointer',borderRadius:4,marginBottom:'1.5rem',letterSpacing:'1px'}}>
          ✕ CERRAR PRENDAS
        </button>
        <div style={{fontFamily:'Playfair Display,serif',fontSize:'1.5rem',color:'var(--oro-claro)',textAlign:'center',marginBottom:'1rem'}}>📝 Prendas</div>
        {msg&&<div className="exito">{msg}</div>}
        <div style={{display:'flex',gap:'.4rem',marginBottom:'1rem',flexWrap:'wrap'}}>
          {['tibio','caliente','llamas'].map(n=>(
            <button key={n} className={`btn-sm${panNivel===n?' on':''}`} onClick={()=>setPanNivel(n)}>
              {NL[n]} ({prendas[n].length})
            </button>
          ))}
        </div>
        <div>
          {prendas[panNivel].map(p=>(
            <div key={p.id} className={`prenda-item${p.custom?' prenda-custom':''}`}>
              <div className="prenda-txt">{p.txt}</div>
              <button className="btn-danger" onClick={()=>delPrenda(panNivel,p.id)} title="Eliminar">🗑</button>
            </div>
          ))}
          {prendas[panNivel].length===0&&<div className="nota" style={{padding:'2rem 0'}}>Sin prendas. ¡Agregá las tuyas!</div>}
        </div>
        <div className="add-prenda">
          <span className="lbl">+ Agregar prenda propia</span>
          <textarea placeholder="Escribí tu prenda acá..." value={nuevaP} onChange={e=>setNuevaP(e.target.value)}/>
          <div className="add-nivel-sel">
            {['tibio','caliente','llamas'].map(n=>(
              <button key={n} className={`add-n-btn${nuevoN===n?' on':''}`} onClick={()=>setNuevoN(n)}>{NL[n]}</button>
            ))}
          </div>
          <button className="btn-gold" style={{marginTop:'.5rem'}} onClick={addPrenda}>AGREGAR</button>
        </div>
        <button onClick={()=>setPanel('juego')}
          style={{width:'100%',marginTop:'1rem',background:'transparent',border:'1px solid rgba(201,168,76,.4)',color:'var(--oro)',padding:'.75rem',fontFamily:'Cinzel,serif',fontSize:'.8rem',cursor:'pointer',borderRadius:3,letterSpacing:'2px'}}>
          ← VOLVER AL JUEGO
        </button>
      </div>
    </div>
    )}

    {/* ── MODAL REGLAS ── */}
    {panel==='reglas'&&(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',zIndex:9999,display:'flex',flexDirection:'column',overflowY:'auto'}}>
      <div style={{width:'100%',maxWidth:520,margin:'0 auto',padding:'1.5rem'}}>
        <button onClick={()=>setPanel('juego')}
          style={{width:'100%',background:'linear-gradient(135deg,#7a5c28,#c9a84c)',color:'#080808',border:'none',padding:'1rem',fontFamily:'Playfair Display,serif',fontSize:'1.1rem',fontWeight:700,cursor:'pointer',borderRadius:4,marginBottom:'1.5rem',letterSpacing:'1px'}}>
          ✕ CERRAR REGLAS
        </button>
        <div style={{fontFamily:'Playfair Display,serif',fontSize:'1.5rem',color:'var(--oro-claro)',textAlign:'center',marginBottom:'1.5rem'}}>📋 Reglas</div>
        {[
          {t:'Objetivo',c:'Sumar más puntos en equipo. El equipo con más puntos gana y es coronados Reyes/Reynas.'},
          {t:'El Rey',c:'Quien saca la carta Rey/Reyna manda esa ronda. Define la consigna, elige quiénes la ejecutan y puede participar, pero nunca suma puntos.'},
          {t:'Puntos',c:'Cada jugador que cumple bien la prenda suma 1 punto individual. Los puntos de cada integrante se acumulan en su equipo.'},
          {t:'El Comodín',c:'Opcional. Debe activarse ANTES de ver la consigna Y ANTES de elegir participantes → suma puntos si cumple. Si se activa después → participa pero no suma puntos.'},
          {t:'Si alguien no quiere cumplir',c:'El Rey/Reyna elige un número nuevo de los observadores para reemplazarlo, o puede entrar el compañero del jugador que SÍ quiere cumplir. En ambos casos el reemplazante no suma puntos. Si la prenda no puede realizarse → se suspende, nadie suma y comienza una nueva ronda.'},
          {t:'Juegan todos',c:'El Rey/Reyna puede decretar "Juegan todos". Tras usarla, los próximos 3 Reyes/Reynas no pueden volver a elegirla.'},
          {t:'La Última Orden',c:'Al terminar, el equipo ganador puede dar una última orden a todos los participantes. Nadie está obligado a cumplirla.'},
          {t:'Consentimiento',c:'Nadie está obligado a jugar ni realizar ninguna prenda. Todo bajo consentimiento. Exclusivo para mayores de 18 años.'},
          {t:'🃏 Mazo necesario para jugar',c:'Se necesita un mazo de naipes español o de póker que contenga del número 1 al 12 (siendo el 12 el Rey) para jugar hasta 12 participantes.'},
          {t:'👑 Versión REY GOLD',c:'Para disfrutar de una experiencia completa e intensa con hasta 20 jugadores, adquirí la versión "REY GOLD" — disponible en la web o por WhatsApp al contacto oficial. Incluye naipes físicos de primera calidad, identificados y personalizados con la imagen oficial del juego, detalles exclusivos y prendas inéditas no disponibles en la versión regular.'},
        ].map((r,i)=>(
          <div key={i} style={{marginBottom:'.85rem',paddingBottom:'.85rem',borderBottom:'1px solid rgba(201,168,76,.1)'}}>
            <div style={{color:'var(--oro)',fontSize:'.72rem',letterSpacing:'2px',marginBottom:'.25rem',textTransform:'uppercase'}}>{r.t}</div>
            <div style={{fontSize:'.88rem',lineHeight:1.65,color:'rgba(245,240,232,.78)'}}>{r.c}</div>
          </div>
        ))}
        <button onClick={()=>setPanel('juego')}
          style={{width:'100%',marginTop:'1rem',background:'transparent',border:'1px solid rgba(201,168,76,.4)',color:'var(--oro)',padding:'.75rem',fontFamily:'Cinzel,serif',fontSize:'.8rem',cursor:'pointer',borderRadius:3,letterSpacing:'2px'}}>
          ← VOLVER AL JUEGO
        </button>
      </div>
    </div>
    )}

    </div>
    <div className="nav-bar">
      {[['juego','♛ JUEGO'],['scores','📊 PUNTOS'],['prendas','📝 PRENDAS']].map(([k,l])=>(
        <button key={k} className={`nav-btn${panel===k?' on':''}`} onClick={()=>setPanel(k)}>{l}</button>
      ))}
      <button className="nav-btn" onClick={()=>setModalReglas(true)} style={{borderColor:'rgba(201,168,76,.4)',color:'var(--oro)'}}>📋 REGLAS</button>
    </div>
    </div>
    </div>

    {/* ── MODAL REGLAS GLOBAL (visible en todas las pantallas) ── */}
    {modalReglas&&(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.95)',zIndex:99999,overflowY:'auto',display:'flex',flexDirection:'column',alignItems:'center'}}>
      <div style={{width:'100%',maxWidth:520,padding:'1.5rem'}}>
        <button onClick={()=>setModalReglas(false)}
          style={{width:'100%',background:'linear-gradient(135deg,#7a5c28,#c9a84c)',color:'#080808',border:'none',padding:'1rem',fontFamily:'Playfair Display,serif',fontSize:'1.1rem',fontWeight:700,cursor:'pointer',borderRadius:4,marginBottom:'1.5rem',letterSpacing:'1px'}}>
          ✕ CERRAR REGLAS
        </button>
        <div style={{fontFamily:'Playfair Display,serif',fontSize:'1.5rem',color:'var(--oro-claro)',textAlign:'center',marginBottom:'1.5rem'}}>📋 Reglas del juego</div>
        {[
          {t:'Objetivo',c:'Sumar más puntos en equipo. El equipo con más puntos gana y es coronados Reyes/Reynas.'},
          {t:'El Rey',c:'Quien saca la carta Rey/Reyna manda esa ronda. Define la consigna, elige quiénes la ejecutan y puede participar, pero nunca suma puntos.'},
          {t:'Puntos',c:'Cada jugador que cumple bien la prenda suma 1 punto individual. Los puntos de cada integrante se acumulan en su equipo.'},
          {t:'El Comodín',c:'Opcional. Debe activarse ANTES de ver la consigna Y ANTES de elegir participantes para sumar puntos. Si se activa después → participa pero no suma puntos.'},
          {t:'Si alguien no quiere cumplir',c:'El Rey/Reyna elige un número nuevo de los observadores para reemplazarlo, o puede entrar el compañero del jugador que SÍ quiere cumplir. En ambos casos el reemplazante no suma puntos. Si la prenda no puede realizarse → se suspende, nadie suma y comienza una nueva ronda.'},
          {t:'Juegan todos',c:'El Rey/Reyna puede decretar "Juegan todos". Tras usarla, los próximos 3 Reyes/Reynas no pueden volver a elegirla.'},
          {t:'La Última Orden',c:'Al terminar, el equipo ganador puede dar una última orden a todos los participantes. Nadie está obligado a cumplirla.'},
          {t:'Consentimiento',c:'Nadie está obligado a jugar ni realizar ninguna prenda. Todo bajo consentimiento. Exclusivo para mayores de 18 años.'},
          {t:'🃏 Mazo necesario para jugar',c:'Se necesita un mazo de naipes español o de póker que contenga del número 1 al 12 (siendo el 12 el Rey) para jugar hasta 12 participantes.'},
          {t:'👑 Versión REY GOLD',c:'Para disfrutar de una experiencia completa e intensa con hasta 20 jugadores, adquirí la versión "REY GOLD" — disponible en la web o por WhatsApp al contacto oficial. Incluye naipes físicos de primera calidad, personalizados con la imagen oficial del juego, detalles exclusivos y prendas inéditas no disponibles en la versión regular.'},
        ].map((r,i)=>(
          <div key={i} style={{marginBottom:'.85rem',paddingBottom:'.85rem',borderBottom:'1px solid rgba(201,168,76,.1)'}}>
            <div style={{color:'var(--oro)',fontSize:'.78rem',letterSpacing:'2px',marginBottom:'.3rem',textTransform:'uppercase',fontFamily:'Cinzel,serif'}}>{r.t}</div>
            <div style={{fontSize:'1rem',lineHeight:1.7,color:'rgba(245,240,232,.82)'}}>{r.c}</div>
          </div>
        ))}
        <button onClick={()=>setModalReglas(false)}
          style={{width:'100%',marginTop:'.5rem',background:'transparent',border:'1px solid rgba(201,168,76,.4)',color:'var(--oro)',padding:'.85rem',fontFamily:'Cinzel,serif',fontSize:'.85rem',cursor:'pointer',borderRadius:3,letterSpacing:'2px'}}>
          ← VOLVER AL JUEGO
        </button>
      </div>
    </div>
    )}
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(r => console.log('SW registrado:', r.scope))
        .catch(e => console.log('SW error:', e));
    });
  }
</script>
</body>
</html>
