name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta todos los lunes y jueves a las 09:00 UTC (06:00 hora Argentina)
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase para evitar la pausa por inactividad
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/licencias?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
